name: Update calendar
on:
  schedule:
    - cron: "15 10 * * *"
    - cron: "0 23 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_calendar.py
      - run: |
          git config user.name "calendar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/fx.ics
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
